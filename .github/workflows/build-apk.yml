name: Build Debug APK & Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          VERSION_STR=$(java -version 2>&1 | head -n 1)
          echo "Java version string: $VERSION_STR"
          JAVA_VER=$(echo "$VERSION_STR" | sed -E 's/.*version "([^"]+)".*/\1/' | cut -d. -f1)
          if [ "$JAVA_VER" = "1" ]; then
            JAVA_VER=$(echo "$VERSION_STR" | sed -E 's/.*version "([^"]+)".*/\1/' | cut -d. -f2)
          fi
          if [ -z "$JAVA_VER" ] || ! [[ "$JAVA_VER" =~ ^[0-9]+$ ]]; then
            echo "Error: Could not detect Java major version."
            exit 1
          fi
          if [ "$JAVA_VER" -lt 17 ]; then
            echo "Error: Java major version is $JAVA_VER, which is lower than 17."
            exit 1
          fi
          echo "Confirmed Java major version is $JAVA_VER (>= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f ./debug.keystore ]; then
            echo "Generating debug.keystore using keytool..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          else
            echo "./debug.keystore already exists."
          fi

          if [ ! -f ./debug.keystore ]; then
            echo "Error: ./debug.keystore does not exist after generation attempt."
            exit 1
          fi
          echo "Confirmed ./debug.keystore exists."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Expected APK missing. Searching inside app/build/outputs/apk..."
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            echo "Error: Expected debug APK $EXPECTED_APK does not exist."
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "Error: $EXPECTED_APK is empty."
            exit 1
          fi

          echo "APK verification passed: $EXPECTED_APK exists, is a non-empty regular file, and has .apk extension."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prep_asset
        run: |
          TMP_DIR=$(mktemp -d)
          REPO_NAME_CLEAN=$(echo "${{ github.repository }}" | sed 's/.*\///' | tr -cd 'a-zA-Z0-9_-')
          RUN_NUM="${{ github.run_number }}"
          ASSET_NAME="${REPO_NAME_CLEAN}-debug-build-${RUN_NUM}.apk"
          ASSET_PATH="${TMP_DIR}/${ASSET_NAME}"

          cp app/build/outputs/apk/debug/app-debug.apk "$ASSET_PATH"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Failed to prepare release asset at $ASSET_PATH"
            exit 1
          fi

          echo "Prepared release asset: $ASSET_PATH"
          echo "asset_path=$ASSET_PATH" >> $GITHUB_OUTPUT
          echo "asset_name=$ASSET_NAME" >> $GITHUB_OUTPUT

      - name: Publish APK to GitHub Releases
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          ASSET_PATH="${{ steps.prep_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prep_asset.outputs.asset_name }}"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Prepared release asset is missing or empty before release creation."
            exit 1
          fi

          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug APK Build #${{ github.run_number }}"

          BODY=$(cat <<EOF
          This is an automatically generated debug APK.
          The APK was built by GitHub Actions.

          - **Run Number:** ${{ github.run_number }}
          - **Run Attempt:** ${{ github.run_attempt }}
          - **Source Commit:** ${{ github.sha }}

          *Note: This APK is intended for testing and is signed only with a temporary debug keystore. It is not a Play Store production release.*
          EOF
          )

          gh release create "$TAG_NAME" "$ASSET_PATH" \
            --title "$TITLE" \
            --notes "$BODY" \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_OUTCOME="${{ steps.create_release.outcome }}"
          ASSET_NAME="${{ steps.prep_asset.outputs.asset_name }}"
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"

          if [ "$RELEASE_OUTCOME" = "success" ]; then
            echo "=== GitHub Release Succeeded ==="
            gh release view "$TAG_NAME" || true
            RELEASE_URL=$(gh release view "$TAG_NAME" --json url -q .url 2>/dev/null || echo "https://github.com/${{ github.repository }}/releases/tag/${TAG_NAME}")

            echo "Release Tag: $TAG_NAME"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_NAME"

            echo "### 🚀 APK Download Available" >> $GITHUB_STEP_SUMMARY
            echo "The debug APK has been published to GitHub Releases!" >> $GITHUB_STEP_SUMMARY
            echo "- **Release Page:** [$RELEASE_URL]($RELEASE_URL)" >> $GITHUB_STEP_SUMMARY
            echo "- **Asset Filename:** \`$ASSET_NAME\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "You can download the APK directly onto your Android device from the **Assets** section on the release page." >> $GITHUB_STEP_SUMMARY
            echo "The normal GitHub Actions artifact \`app-debug-apk\` is also available as a backup." >> $GITHUB_STEP_SUMMARY
          else
            echo "=== WARNING: GitHub Release Publishing Failed or Skipped ==="
            echo "APK build and verification succeeded."
            echo "The GitHub Actions artifact 'app-debug-apk' remains available for download."

            echo "### ⚠️ Release Publishing Warning" >> $GITHUB_STEP_SUMMARY
            echo "The debug APK was built successfully, but GitHub Release publishing encountered an issue or was skipped." >> $GITHUB_STEP_SUMMARY
            echo "- **Backup Artifact:** The APK is available in the **Artifacts** section of this GitHub Actions run under the name \`app-debug-apk\`." >> $GITHUB_STEP_SUMMARY
          fi
